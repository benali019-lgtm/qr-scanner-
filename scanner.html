<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ماسح QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      font-size: 20px;
      padding: 14px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #زر_واحد {
      background: #2563eb;
      color: white;
    }

    #زر_متعدد {
      background: #16a34a;
      color: white;
    }

    #إيقاف {
      background: #dc2626;
      color: white;
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #النتيجة {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #166534;
      word-break: break-word;
    }

    #العداد {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <h2>📷 ماسح QR للتلاميذ</h2>


  <button
    id="زر_واحد"
    type="button">

    📷 مسح QR واحد

  </button>


  <button
    id="زر_متعدد"
    type="button">

    📷 مسح QR متعدد

  </button>


  <button
    id="إيقاف"
    type="button">

    ⛔ إيقاف المسح

  </button>


  <div id="reader"></div>


  <div id="النتيجة">
    اختر نوع المسح
  </div>


  <div id="العداد">
    عدد التلاميذ: 0
  </div>


  <script>

    let الماسح = null;

    let وضع_المسح = "";

    let تم_المسح = false;

    let آخر_رقم = "";

    let وقت_آخر_مسح = 0;

    let عدد_التلاميذ = 0;

    const الأرقام_الممسوحة =
      new Set();


    // =====================================
    // إرسال الرقم إلى صفحة المؤسسة
    // =====================================

    function إرسال_الرقم(الرقم) {

      if (!window.opener) {
        return;
      }

      window.opener.postMessage(

        {
          type:
            "QR_تلميذ_المطعم",

          value:
            الرقم
        },

        "*"

      );

    }


    // =====================================
    // تشغيل الكاميرا
    // =====================================

    function تشغيل_الكاميرا() {

      if (الماسح) {
        return;
      }

      الماسح =
        new Html5Qrcode("reader");


      الماسح.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(النص) {

          const الرقم =
            String(
              النص || ""
            ).trim();


          if (!الرقم) {
            return;
          }


          const الآن =
            Date.now();


          // =================================
          // منع القراءة المتكررة
          // =================================

          if (
            الرقم === آخر_رقم &&
            الآن - وقت_آخر_مسح < 2000
          ) {

            return;

          }


          آخر_رقم = الرقم;

          وقت_آخر_مسح = الآن;


          // =================================
          // المسح المتعدد
          // =================================

          if (
            وضع_المسح ===
            "متعدد"
          ) {

            // إذا كان QR قد مسح سابقًا
            if (
              الأرقام_الممسوحة.has(
                الرقم
              )
            ) {

              return;

            }


            الأرقام_الممسوحة.add(
              الرقم
            );


            عدد_التلاميذ++;


            document.getElementById(
              "العداد"
            ).textContent =
              "عدد التلاميذ: " +
              عدد_التلاميذ;


            document.getElementById(
              "النتيجة"
            ).textContent =
              "✅ تم مسح: " +
              الرقم;


            إرسال_الرقم(
              الرقم
            );


            // لا نوقف الكاميرا

            return;

          }


          // =================================
          // المسح الفردي
          // =================================

          if (
            وضع_المسح ===
            "واحد"
          ) {

            if (تم_المسح) {
              return;
            }


            تم_المسح = true;


            document.getElementById(
              "النتيجة"
            ).textContent =
              "✅ تم مسح: " +
              الرقم;


            إرسال_الرقم(
              الرقم
            );


            إيقاف_الكاميرا();


            // إغلاق النافذة بعد المسح الفردي

            setTimeout(
              function() {

                window.close();

              },
              500
            );

          }

        },

        function() {

          // تجاهل أخطاء البحث العادية

        }

      )

      .catch(function(خطأ) {

        document.getElementById(
          "النتيجة"
        ).textContent =
          "❌ تعذر تشغيل الكاميرا: " +
          خطأ;

        الماسح = null;

      });

    }


    // =====================================
    // إيقاف الكاميرا
    // =====================================

    function إيقاف_الكاميرا() {

      if (!الماسح) {
        return;
      }


      الماسح
        .stop()
        .then(function() {

          الماسح.clear();

          الماسح = null;

        })
        .catch(function(خطأ) {

          console.log(
            "خطأ عند إيقاف الكاميرا:",
            خطأ
          );

          الماسح = null;

        });

    }


    // =====================================
    // مسح QR واحد
    // =====================================

    document.getElementById(
      "زر_واحد"
    ).addEventListener(
      "click",
      function() {

        إيقاف_الكاميرا();


        وضع_المسح =
          "واحد";


        تم_المسح =
          false;


        document.getElementById(
          "النتيجة"
        ).textContent =
          "وجّه الكاميرا نحو QR";


        document.getElementById(
          "إيقاف"
        ).style.display =
          "inline-block";


        setTimeout(
          تشغيل_الكاميرا,
          300
        );

      }
    );


    // =====================================
    // مسح QR متعدد
    // =====================================

    document.getElementById(
      "زر_متعدد"
    ).addEventListener(
      "click",
      function() {

        إيقاف_الكاميرا();


        وضع_المسح =
          "متعدد";


        تم_المسح =
          false;


        آخر_رقم =
          "";


        عدد_التلاميذ =
          0;


        الأرقام_الممسوحة.clear();


        document.getElementById(
          "العداد"
        ).textContent =
          "عدد التلاميذ: 0";


        document.getElementById(
          "النتيجة"
        ).textContent =
          "وجّه الكاميرا نحو QR";


        document.getElementById(
          "إيقاف"
        ).style.display =
          "inline-block";


        setTimeout(
          تشغيل_الكاميرا,
          300
        );

      }
    );


    // =====================================
    // زر إيقاف المسح
    // =====================================

    document.getElementById(
      "إيقاف"
    ).addEventListener(
      "click",
      function() {

        إيقاف_الكاميرا();


        وضع_المسح =
          "";


        document.getElementById(
          "إيقاف"
        ).style.display =
          "none";


        document.getElementById(
          "النتيجة"
        ).textContent =
          "تم إيقاف المسح";

      }
    );

  </script>

</body>

</html>
